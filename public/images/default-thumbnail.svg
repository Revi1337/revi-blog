<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d14" />
    </linearGradient>

    <!-- Border Gradient for Card -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#57de9f" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#334155" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#00b4d8" stop-opacity="0.6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>

    <!-- ClipPath for Window Corner Radius -->
    <clipPath id="window-clip-full-dark">
      <rect width="380" height="230" rx="14" ry="14" />
    </clipPath>
  </defs>

  <!-- Base Background -->
  <rect width="640" height="360" fill="url(#bg-grad)" />

  <!-- Glowing Radial Blobs -->
  <circle cx="500" cy="90" r="160" fill="#00e38a" opacity="0.08" filter="url(#glow)" />
  <circle cx="140" cy="270" r="140" fill="#00b4d8" opacity="0.06" filter="url(#glow)" />

  <!-- Center Glassmorphism Code Terminal Window -->
  <g transform="translate(130, 65)">
    <!-- Clipped Window Content -->
    <g clip-path="url(#window-clip-full-dark)">
      <!-- Card Background Body -->
      <rect width="380" height="230" fill="#0f172a" />

      <!-- Seamless Integrated Terminal Header Bar -->
      <rect width="380" height="40" fill="#1e293b" />
      <line x1="0" y1="40" x2="380" y2="40" stroke="#334155" stroke-width="1" opacity="0.6" />

      <!-- Window Dots -->
      <circle cx="20" cy="20" r="5" fill="#ef4444" opacity="0.85" />
      <circle cx="36" cy="20" r="5" fill="#f59e0b" opacity="0.85" />
      <circle cx="52" cy="20" r="5" fill="#10b981" opacity="0.85" />

      <!-- Terminal Path Title -->
      <text x="190" y="24" fill="#64748b" font-family="'JetBrains Mono', Pretendard, monospace" font-size="11" text-anchor="middle" letter-spacing="0.5">article/default-thumbnail</text>

      <!-- Code Content Inside Terminal -->
      <g font-family="'JetBrains Mono', Pretendard, monospace" font-size="13">
        <!-- Line 1: import { blog } from "@/revi" -->
        <text x="28" y="76" fill="#64748b" font-size="11">01</text>
        <text x="56" y="76" fill="#57de9f" font-weight="600">import</text>
        <text x="108" y="76" fill="#e2e8f0">{ blog }</text>
        <text x="178" y="76" fill="#57de9f" font-weight="600">from</text>
        <text x="216" y="76" fill="#38bdf8">"@/revi"</text>

        <!-- Line 2 -->
        <text x="28" y="106" fill="#64748b" font-size="11">02</text>

        <!-- Line 3: export default function Article () { -->
        <text x="28" y="136" fill="#64748b" font-size="11">03</text>
        <text x="56" y="136" fill="#f43f5e" font-weight="600">export default</text>
        <text x="172" y="136" fill="#57de9f" font-weight="600">function</text>
        <text x="242" y="136" fill="#fbbf24">Article</text>
        <text x="299" y="136" fill="#e2e8f0">() {</text>

        <!-- Line 4: return <ReviPost status="published" /> -->
        <text x="28" y="166" fill="#64748b" font-size="11">04</text>
        <text x="76" y="166" fill="#57de9f" font-weight="600">return</text>
        <text x="128" y="166" fill="#cbd5e1">&lt;</text>
        <text x="137" y="166" fill="#38bdf8">ReviPost</text>
        <text x="204" y="166" fill="#a7f3d0">status</text>
        <text x="250" y="166" fill="#cbd5e1">=</text>
        <text x="259" y="166" fill="#38bdf8">"published"</text>
        <text x="353" y="166" fill="#cbd5e1">/&gt;</text>

        <!-- Line 5 -->
        <text x="28" y="196" fill="#64748b" font-size="11">05</text>
        <text x="56" y="196" fill="#e2e8f0">}</text>

        <!-- Cursor -->
        <rect x="70" y="185" width="8" height="14" fill="#00e38a" opacity="0.8" />
      </g>
    </g>

    <!-- Continuous Overlay Outer Border Frame -->
    <rect width="380" height="230" rx="14" fill="none" stroke="url(#border-grad)" stroke-width="1.5" />
  </g>
</svg>
